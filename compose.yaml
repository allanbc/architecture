services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres-archi
    environment:
      POSTGRES_DB: ${DB_NAME:-db_archi}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_archi_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: architecture-api:${APP_IMAGE_TAG:-latest}
    container_name: architecture-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-db_archi}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres_archi_data:
